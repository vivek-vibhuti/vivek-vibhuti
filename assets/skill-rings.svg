<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <linearGradient id="ring-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="100%" stop-color="#D414FE"/>
    </linearGradient>
    <linearGradient id="ring-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E77F"/>
      <stop offset="100%" stop-color="#00FFB7"/>
    </linearGradient>
    <linearGradient id="ring-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D414FE"/>
      <stop offset="100%" stop-color="#FB0094"/>
    </linearGradient>
    <linearGradient id="ring-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFA116"/>
    </linearGradient>
    <filter id="ring-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="350" y="20" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="12" fill="#00F7FF" font-weight="bold">TECHNICAL PROFICIENCY — NEURAL SYNAPSE RINGS</text>
  
  <!-- Ring 1: AI/ML Engineering (90%) -->
  <g transform="translate(100, 120)">
    <circle r="45" stroke="#161b22" stroke-width="8" fill="none"/>
    <circle r="45" stroke="url(#ring-cyan)" stroke-width="8" fill="none" stroke-dasharray="282.7" stroke-dashoffset="28.3" stroke-linecap="round" filter="url(#ring-glow)">
      <animate attributeName="stroke-dashoffset" values="282.7;28.3" dur="2s" repeatCount="1" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze"/>
    </circle>
    <circle r="45" stroke="#00F7FF" stroke-width="4" fill="none" stroke-dasharray="10,10" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="11" fill="#00F7FF" font-weight="bold">AI/ML</text>
    <text x="0" y="20" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="16" fill="#00F7FF" font-weight="bold">90%</text>
  </g>
  
  <!-- Ring 2: RAG & Vector DBs (85%) -->
  <g transform="translate(240, 120)">
    <circle r="45" stroke="#161b22" stroke-width="8" fill="none"/>
    <circle r="45" stroke="url(#ring-emerald)" stroke-width="8" fill="none" stroke-dasharray="282.7" stroke-dashoffset="42.4" stroke-linecap="round" filter="url(#ring-glow)">
      <animate attributeName="stroke-dashoffset" values="282.7;42.4" dur="2s" repeatCount="1" fill="freeze" begin="0.3s"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.3s"/>
    </circle>
    <circle r="45" stroke="#00E77F" stroke-width="4" fill="none" stroke-dasharray="10,10" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="11" fill="#00E77F" font-weight="bold">RAG/DB</text>
    <text x="0" y="20" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="16" fill="#00E77F" font-weight="bold">85%</text>
  </g>
  
  <!-- Ring 3: Backend & API (88%) -->
  <g transform="translate(380, 120)">
    <circle r="45" stroke="#161b22" stroke-width="8" fill="none"/>
    <circle r="45" stroke="url(#ring-magenta)" stroke-width="8" fill="none" stroke-dasharray="282.7" stroke-dashoffset="33.9" stroke-linecap="round" filter="url(#ring-glow)">
      <animate attributeName="stroke-dashoffset" values="282.7;33.9" dur="2s" repeatCount="1" fill="freeze" begin="0.6s"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.6s"/>
    </circle>
    <circle r="45" stroke="#D414FE" stroke-width="4" fill="none" stroke-dasharray="10,10" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="11" fill="#D414FE" font-weight="bold">BACKEND</text>
    <text x="0" y="20" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="16" fill="#D414FE" font-weight="bold">88%</text>
  </g>
  
  <!-- Ring 4: Cloud & DevOps (82%) -->
  <g transform="translate(520, 120)">
    <circle r="45" stroke="#161b22" stroke-width="8" fill="none"/>
    <circle r="45" stroke="url(#ring-orange)" stroke-width="8" fill="none" stroke-dasharray="282.7" stroke-dashoffset="50.9" stroke-linecap="round" filter="url(#ring-glow)">
      <animate attributeName="stroke-dashoffset" values="282.7;50.9" dur="2s" repeatCount="1" fill="freeze" begin="0.9s"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.9s"/>
    </circle>
    <circle r="45" stroke="#FF6B35" stroke-width="4" fill="none" stroke-dasharray="10,10" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="11" fill="#FF6B35" font-weight="bold">CLOUD</text>
    <text x="0" y="20" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="16" fill="#FF6B35" font-weight="bold">82%</text>
  </g>
  
  <!-- Ring 5: Data & Storage (78%) -->
  <g transform="translate(170, 180)">
    <circle r="30" stroke="#161b22" stroke-width="6" fill="none"/>
    <circle r="30" stroke="url(#ring-cyan)" stroke-width="6" fill="none" stroke-dasharray="188.5" stroke-dashoffset="41.5" stroke-linecap="round" filter="url(#ring-glow)">
      <animate attributeName="stroke-dashoffset" values="188.5;41.5" dur="1.5s" repeatCount="1" fill="freeze" begin="1.2s"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="1.2s"/>
    </circle>
    <text x="0" y="4" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="9" fill="#00F7FF" font-weight="bold">DATA</text>
    <text x="0" y="16" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="13" fill="#00F7FF" font-weight="bold">78%</text>
  </g>
  
  <!-- Ring 6: Frontend (75%) -->
  <g transform="translate(310, 180)">
    <circle r="30" stroke="#161b22" stroke-width="6" fill="none"/>
    <circle r="30" stroke="url(#ring-emerald)" stroke-width="6" fill="none" stroke-dasharray="188.5" stroke-dashoffset="47.1" stroke-linecap="round" filter="url(#ring-glow)">
      <animate attributeName="stroke-dashoffset" values="188.5;47.1" dur="1.5s" repeatCount="1" fill="freeze" begin="1.5s"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="1.5s"/>
    </circle>
    <text x="0" y="4" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="9" fill="#00E77F" font-weight="bold">FRONTEND</text>
    <text x="0" y="16" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="13" fill="#00E77F" font-weight="bold">75%</text>
  </g>
  
  <!-- Ring 7: Core CS (92%) -->
  <g transform="translate(450, 180)">
    <circle r="30" stroke="#161b22" stroke-width="6" fill="none"/>
    <circle r="30" stroke="url(#ring-magenta)" stroke-width="6" fill="none" stroke-dasharray="188.5" stroke-dashoffset="15.1" stroke-linecap="round" filter="url(#ring-glow)">
      <animate attributeName="stroke-dashoffset" values="188.5;15.1" dur="1.5s" repeatCount="1" fill="freeze" begin="1.8s"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="1.8s"/>
    </circle>
    <text x="0" y="4" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="9" fill="#D414FE" font-weight="bold">CORE CS</text>
    <text x="0" y="16" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="13" fill="#D414FE" font-weight="bold">92%</text>
  </g>
  
  <!-- Ring 8: MLOps (80%) -->
  <g transform="translate(590, 180)">
    <circle r="30" stroke="#161b22" stroke-width="6" fill="none"/>
    <circle r="30" stroke="url(#ring-orange)" stroke-width="6" fill="none" stroke-dasharray="188.5" stroke-dashoffset="37.7" stroke-linecap="round" filter="url(#ring-glow)">
      <animate attributeName="stroke-dashoffset" values="188.5;37.7" dur="1.5s" repeatCount="1" fill="freeze" begin="2.1s"/>
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="2.1s"/>
    </circle>
    <text x="0" y="4" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="9" fill="#FF6B35" font-weight="bold">MLOPS</text>
    <text x="0" y="16" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="13" fill="#FF6B35" font-weight="bold">80%</text>
  </g>
  
  <!-- Connecting lines (synapses) -->
  <g stroke="#0d1117" stroke-width="1.5" opacity="0.3">
    <line x1="145" y1="120" x2="195" y2="120">
      <animate attributeName="stroke" values="#0d1117;#00F7FF;#0d1117" dur="3s" repeatCount="indefinite" begin="2.5s"/>
    </line>
    <line x1="285" y1="120" x2="335" y2="120">
      <animate attributeName="stroke" values="#0d1117;#00E77F;#0d1117" dur="3s" repeatCount="indefinite" begin="2.8s"/>
    </line>
    <line x1="425" y1="120" x2="475" y2="120">
      <animate attributeName="stroke" values="#0d1117;#D414FE;#0d1117" dur="3s" repeatCount="indefinite" begin="3.1s"/>
    </line>
  </g>
</svg>