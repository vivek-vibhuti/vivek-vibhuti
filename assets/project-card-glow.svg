<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="600" height="100">
  <defs>
    <linearGradient id="card-glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card-glow-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D414FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D414FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D414FE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card-glow-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E77F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E77F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E77F" stop-opacity="0"/>
    </linearGradient>
    <filter id="card-glow-blur">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Top border glow pulse -->
  <rect x="0" y="0" width="600" height="3" fill="url(#card-glow-cyan)" filter="url(#card-glow-blur)">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Bottom border glow pulse -->
  <rect x="0" y="97" width="600" height="3" fill="url(#card-glow-magenta)" filter="url(#card-glow-blur)">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </rect>
  
  <!-- Left border glow -->
  <rect x="0" y="0" width="3" height="100" fill="url(#card-glow-emerald)" filter="url(#card-glow-blur)">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Right border glow -->
  <rect x="597" y="0" width="3" height="100" fill="url(#card-glow-emerald)" filter="url(#card-glow-blur)">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" begin="2s"/>
  </rect>
  
  <!-- Corner accents -->
  <circle cx="5" cy="5" r="3" fill="#00F7FF" opacity="0.6">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="595" cy="5" r="3" fill="#D414FE" opacity="0.6">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="5" cy="95" r="3" fill="#00E77F" opacity="0.6">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="595" cy="95" r="3" fill="#FB0094" opacity="0.6">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Scanning line -->
  <rect x="0" y="0" width="600" height="2" fill="#00F7FF" opacity="0.4">
    <animate attributeName="y" values="0;100;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>