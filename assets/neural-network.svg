<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150">
  <defs>
    <linearGradient id="neural-div-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="33%" stop-color="#D414FE"/>
      <stop offset="66%" stop-color="#00E77F"/>
      <stop offset="100%" stop-color="#FB0094"/>
    </linearGradient>
    <radialGradient id="neuron-glow-div" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#D414FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="div-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="url(#neural-div-cyan)"/>
    </marker>
    <marker id="arrow-magenta" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D414FE"/>
    </marker>
  </defs>
  
  <!-- Background subtle circuit pattern -->
  <g opacity="0.03" stroke="#00F7FF" stroke-width="0.5">
    <path d="M0,75 Q200,25 400,75 Q600,125 800,75" fill="none"/>
    <path d="M0,75 Q200,125 400,75 Q600,25 800,75" fill="none" stroke="#D414FE"/>
  </g>
  
  <!-- Layer 1: Input Neurons -->
  <g id="input-neurons">
    <circle cx="60" cy="30" r="12" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="75" r="12" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="60" cy="120" r="12" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <text x="60" y="145" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="8" fill="#00F7FF">INPUT</text>
  </g>
  
  <!-- Layer 2: Hidden 1 -->
  <g id="hidden-1">
    <circle cx="200" cy="20" r="14" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite" begin="0.1s"/>
    </circle>
    <circle cx="200" cy="55" r="14" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="200" cy="90" r="14" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="200" cy="125" r="14" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  
  <!-- Layer 3: Hidden 2 (wider) -->
  <g id="hidden-2">
    <circle cx="340" cy="15" r="16" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="16;20;16" dur="1.6s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="340" cy="50" r="16" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="16;20;16" dur="1.6s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="340" cy="85" r="16" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="16;20;16" dur="1.6s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="340" cy="120" r="16" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="16;20;16" dur="1.6s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle cx="340" cy="135" r="16" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="16;20;16" dur="1.6s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
  </g>
  
  <!-- Layer 4: Hidden 3 -->
  <g id="hidden-3">
    <circle cx="480" cy="25" r="14" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite" begin="0.15s"/>
    </circle>
    <circle cx="480" cy="65" r="14" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite" begin="0.45s"/>
    </circle>
    <circle cx="480" cy="105" r="14" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite" begin="0.75s"/>
    </circle>
    <circle cx="480" cy="135" r="14" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite" begin="1.05s"/>
    </circle>
  </g>
  
  <!-- Layer 5: Hidden 4 -->
  <g id="hidden-4">
    <circle cx="620" cy="20" r="12" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite" begin="0.1s"/>
    </circle>
    <circle cx="620" cy="55" r="12" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="620" cy="90" r="12" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="620" cy="125" r="12" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  
  <!-- Layer 6: Output -->
  <g id="output-neurons">
    <circle cx="740" cy="50" r="14" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="100" r="14" fill="url(#neuron-glow-div)" filter="url(#div-glow)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <text x="740" y="140" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="8" fill="#D414FE">OUTPUT</text>
  </g>
  
  <!-- Synapses (connections) - Animated pulses traveling between layers -->
  <g stroke="url(#neural-div-cyan)" stroke-width="1.2" fill="none" opacity="0.5" filter="url(#div-glow)">
    <!-- Input to Hidden 1 -->
    <line x1="72" y1="30" x2="186" y2="20">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="72" y1="30" x2="186" y2="55"/>
    <line x1="72" y1="30" x2="186" y2="90"/>
    <line x1="72" y1="30" x2="186" y2="125"/>
    
    <line x1="72" y1="75" x2="186" y2="20"/>
    <line x1="72" y1="75" x2="186" y2="55">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="72" y1="75" x2="186" y2="90"/>
    <line x1="72" y1="75" x2="186" y2="125"/>
    
    <line x1="72" y1="120" x2="186" y2="20"/>
    <line x1="72" y1="120" x2="186" y2="55"/>
    <line x1="72" y1="120" x2="186" y2="90"/>
    <line x1="72" y1="120" x2="186" y2="125">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </line>
    
    <!-- Hidden 1 to Hidden 2 -->
    <line x1="214" y1="20" x2="324" y2="15">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.1s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.1s"/>
    </line>
    <line x1="214" y1="55" x2="324" y2="50">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
    </line>
    <line x1="214" y1="90" x2="324" y2="85">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.7s"/>
    </line>
    <line x1="214" y1="125" x2="324" y2="120">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </line>
    
    <!-- Hidden 2 to Hidden 3 -->
    <line x1="356" y1="15" x2="464" y2="25">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
    </line>
    <line x1="356" y1="50" x2="464" y2="65">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="356" y1="85" x2="464" y2="105">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.8s"/>
    </line>
    <line x1="356" y1="120" x2="464" y2="135">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="1.1s"/>
    </line>
    
    <!-- Hidden 3 to Hidden 4 -->
    <line x1="494" y1="25" x2="606" y2="20">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.15s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.15s"/>
    </line>
    <line x1="494" y1="65" x2="606" y2="55">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.45s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.45s"/>
    </line>
    <line x1="494" y1="105" x2="606" y2="90">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
    </line>
    <line x1="494" y1="135" x2="606" y2="125">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="1.05s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="1.05s"/>
    </line>
    
    <!-- Hidden 4 to Output -->
    <line x1="632" y1="20" x2="726" y2="50">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.1s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.1s"/>
    </line>
    <line x1="632" y1="55" x2="726" y2="50">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
    </line>
    <line x1="632" y1="90" x2="726" y2="100">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.7s"/>
    </line>
    <line x1="632" y1="125" x2="726" y2="100">
      <animate attributeName="stroke-dashoffset" values="150;0" dur="1.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </line>
  </g>
  
  <!-- Labels for layers -->
  <text x="60" y="15" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="7" fill="#00F7FF" opacity="0.7">L0</text>
  <text x="200" y="10" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="7" fill="#D414FE" opacity="0.7">L1</text>
  <text x="340" y="5" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="7" fill="#00E77F" opacity="0.7">L2</text>
  <text x="480" y="10" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="7" fill="#FB0094" opacity="0.7">L3</text>
  <text x="620" y="10" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="7" fill="#FF6B35" opacity="0.7">L4</text>
  <text x="740" y="15" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="7" fill="#FFA116" opacity="0.7">L5</text>
  
  <!-- Title -->
  <text x="400" y="10" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="10" fill="#00F7FF" font-weight="bold" opacity="0.8">NEURAL ARCHITECTURE — FORWARD PASS VISUALIZATION</text>
</svg>