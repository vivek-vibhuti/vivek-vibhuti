<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00F7FF" stroke-width="0.5" opacity="0.3"/>
      <path d="M 0 0 L 50 0 0 50" fill="none" stroke="#D414FE" stroke-width="0.3" opacity="0.2"/>
    </pattern>
    <pattern id="grid-small" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#00F7FF" stroke-width="0.2" opacity="0.15"/>
    </pattern>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#D414FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E77F" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#D414FE" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  
  <!-- Base grid -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#grid-small)"/>
  
  <!-- Central glow -->
  <circle cx="500" cy="200" r="300" fill="url(#center-glow)"/>
  
  <!-- Corner accents -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#00F7FF" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="80;120;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="100" r="80" fill="none" stroke="#D414FE" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="80;120;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="300" r="80" fill="none" stroke="#00E77F" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="80;120;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="300" r="80" fill="none" stroke="#FB0094" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="80;120;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating particles -->
  <g fill="#00F7FF" opacity="0.6">
    <circle cx="150" cy="150" r="1.5">
      <animate attributeName="cy" values="150;100;150" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="250" r="1">
      <animate attributeName="cy" values="250;200;250" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="350" r="1.2">
      <animate attributeName="cx" values="300;350;300" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="80" r="1.5">
      <animate attributeName="cy" values="80;130;80" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="50" r="1">
      <animate attributeName="cy" values="50;100;50" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="280" r="1.3">
      <animate attributeName="cx" values="200;250;200" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="320" r="1">
      <animate attributeName="cx" values="800;750;800" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g fill="#D414FE" opacity="0.5">
    <circle cx="400" cy="180" r="1">
      <animate attributeName="cy" values="180;130;180" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="220" r="1.2">
      <animate attributeName="cx" values="600;650;600" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g fill="#00E77F" opacity="0.4">
    <circle cx="250" cy="200" r="1">
      <animate attributeName="cy" values="200;150;200" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="180" r="1.3">
      <animate attributeName="cx" values="750;700;750" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>